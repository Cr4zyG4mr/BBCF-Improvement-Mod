name: Build Proton CBR fix

on:
  push:
    branches:
      - proton-cbr-fix
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Proton/Wine CBR patch
        shell: pwsh
        run: git apply --verbose proton-cbr-ci.patch

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Install Boost and OpenSSL dependencies
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not defined on this runner"
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install `
            boost-filesystem:x86-windows-static `
            boost-iostreams:x86-windows-static `
            boost-serialization:x86-windows-static `
            boost-thread:x86-windows-static `
            boost-numeric-ublas:x86-windows-static `
            openssl:x86-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release Win32
        shell: pwsh
        run: msbuild BBCF_IM.sln /m /p:Configuration=Release /p:Platform=Win32 /p:VcpkgEnabled=true /p:VcpkgTriplet=x86-windows-static

      - name: Upload patched mod
        uses: actions/upload-artifact@v4
        with:
          name: BBCF-Improvement-Mod-Proton-CBR-patched
          path: |
            bin/Release/dinput8.dll
            bin/Release/settings.ini
            bin/Release/palettes.ini
          if-no-files-found: error
