name: Build Proton CBR fix

on:
  push:
    branches:
      - proton-cbr-fix
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Proton/Wine CBR patch
        shell: pwsh
        run: git apply --verbose proton-cbr-ci.patch

      - name: Apply replay deletion safety patch
        shell: pwsh
        run: git apply --verbose cbr-replay-delete-safety.patch

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Install native dependencies
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not defined on this runner"
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install `
            boost-algorithm:x86-windows-static `
            boost-beast:x86-windows-static `
            boost-filesystem:x86-windows-static `
            boost-iostreams:x86-windows-static `
            boost-serialization:x86-windows-static `
            boost-thread:x86-windows-static `
            boost-ublas:x86-windows-static `
            openssl:x86-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Fail early if any directly-used third-party headers are still absent.
          $includeRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x86-windows-static\include"
          $requiredHeaders = @(
            "boost\algorithm\string.hpp",
            "boost\archive\binary_iarchive.hpp",
            "boost\beast\core\detail\base64.hpp",
            "boost\filesystem.hpp",
            "boost\iostreams\filter\gzip.hpp",
            "boost\numeric\ublas\storage.hpp",
            "boost\thread.hpp",
            "openssl\ssl.h"
          )
          foreach ($header in $requiredHeaders) {
            $headerPath = Join-Path $includeRoot $header
            if (-not (Test-Path $headerPath)) {
              throw "Required dependency header is missing: $headerPath"
            }
          }

      - name: Build Release Win32
        shell: pwsh
        run: |
          # cpp-httplib's SSLClient uses OpenSSL directly. vcpkg supplies the
          # library search path; LINK supplies the libraries themselves.
          $env:LINK = "/DEFAULTLIB:libssl.lib /DEFAULTLIB:libcrypto.lib $env:LINK"
          msbuild BBCF_IM.sln /m /p:Configuration=Release /p:Platform=Win32 /p:VcpkgEnabled=true /p:VcpkgTriplet=x86-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload patched mod
        uses: actions/upload-artifact@v4
        with:
          name: BBCF-Improvement-Mod-Proton-CBR-patched
          path: |
            bin/Release/dinput8.dll
            bin/Release/settings.ini
            bin/Release/palettes.ini
          if-no-files-found: error
