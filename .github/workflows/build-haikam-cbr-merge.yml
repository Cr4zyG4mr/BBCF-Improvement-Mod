name: Build HaiKam CBR integration

on:
  push:
    branches:
      - haikam-cbr-merge
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
      VCPKG_DOWNLOADS: ${{ github.workspace }}\.vcpkg-downloads

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply CBR compatibility patches
        shell: pwsh
        run: |
          $patches = @(
            "cbr-modern-compat.patch",
            "cbr-runtime-safety.patch",
            "cbr-replay-delete-safety.patch",
            "cbr-data-manager-json-fix.patch",
            "cbr-match-lifecycle.patch",
            "cbr-menu-mode-parity.patch",
            "cbr-auto-save-lifecycle.patch",
            "cbr-versus-final-input.patch",
            "cbr-steamid-probe.patch",
            "cbr-online-runtime-safety.patch",
            "cbr-online-dormant-branch-fix.patch",
            "cbr-netplay-stack-frame-fix.patch",
            "cbr-steamid-match-map-probe.patch",
            "cbr-steamid-persistence.patch",
            "cbr-conversion-safety.patch",
            "cbr-conversion-diagnostics.patch",
            "cbr-network-diagnostics.patch",
            "cbr-kagura-orb-directions.patch",
            "cbr-exit-diagnostics.patch"
          )

          foreach ($patch in $patches) {
            Write-Host "Applying $patch"
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git apply --verbose $patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Test process exit diagnostics (Win32)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b %errorlevel%
          python tools/test_exit_diagnostics.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Prepare vcpkg cache
        id: vcpkg-cache-info
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not defined on this runner"
          }

          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null

          $revision = (git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $revision) {
            throw "Could not determine the runner's vcpkg revision"
          }
          "revision=$revision" >> $env:GITHUB_OUTPUT
          Write-Host "vcpkg revision: $revision"
          Write-Host "Binary cache: $env:VCPKG_DEFAULT_BINARY_CACHE"
          Write-Host "Downloads cache: $env:VCPKG_DOWNLOADS"

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-${{ runner.os }}-x86-windows-static-${{ steps.vcpkg-cache-info.outputs.revision }}-cbr-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-x86-windows-static-

      - name: Install CBR native dependencies
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not defined on this runner"
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install `
            boost-algorithm:x86-windows-static `
            boost-beast:x86-windows-static `
            boost-filesystem:x86-windows-static `
            boost-iostreams:x86-windows-static `
            boost-serialization:x86-windows-static `
            boost-thread:x86-windows-static `
            boost-ublas:x86-windows-static `
            openssl:x86-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $vcpkg integrate install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test CBR SteamID archive compatibility (Win32)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b %errorlevel%
          python tools/test_cbr_storage.py --boost-root "%VCPKG_INSTALLATION_ROOT%\installed\x86-windows-static"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /EHsc /std:c++17 tools/cbr_identity_test.cpp /Fe:cbr_identity_test.exe
          if errorlevel 1 exit /b %errorlevel%
          cbr_identity_test.exe
          if errorlevel 1 exit /b %errorlevel%

      - name: Test CBR conversion and rollback safety (Win32)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b %errorlevel%
          python tools/test_cbr_conversion.py --boost-root "%VCPKG_INSTALLATION_ROOT%\installed\x86-windows-static"
          if errorlevel 1 exit /b %errorlevel%

      - name: Test passive network diagnostics (Win32)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b %errorlevel%
          python tools/test_network_diagnostics.py
          if errorlevel 1 exit /b %errorlevel%

      - name: Build Release Win32
        shell: pwsh
        run: |
          $env:LINK = "/DEFAULTLIB:libssl.lib /DEFAULTLIB:libcrypto.lib $env:LINK"
          msbuild BBCF_IM.sln /m /p:Configuration=Release /p:Platform=Win32 /p:VcpkgEnabled=true /p:VcpkgTriplet=x86-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload integration build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BBCF-Improvement-Mod-HaiKam-CBR
          path: |
            bin/Release/BBCF.IM.win-x86.*.zip
            bin/Release/update-manifest.json
            build/symbols/**/Release/dinput8.dll
            build/symbols/**/Release/dinput8.pdb
          if-no-files-found: warn
